<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project CRUD</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Product Management</h1>
    </header>

    <div class="main-container">
      <!-- Form section -->
      <div class="form-section">
        <h2 id="form-title">Add Product</h2>
        <form id="product-form">
          <input type="hidden" id="product-id">
          <div class="form-row">
            <input type="text" placeholder="Product Title" id="title" required>
            <input type="number" placeholder="Price" id="price" required min="0" step="0.01">
          </div>

          <div class="form-row">
            <select required id="category">
              <option value="">Select Category</option>
              <option value="smartphones">Smartphones</option>
              <option value="laptops">Laptops</option>
              <option value="fragrences">Fragrences</option>
              <option value="skincare">Skincare</option>
              <option value="groceries">Groceries</option>
            </select>
            <input type="url" id="thumbnail" placeholder="Image URL" required>
          </div>

          <textarea id="description" required placeholder="Product Description"></textarea>

          <div class="form-actions">
            <button type="submit" id="submit-btn">Add</button>
            <button type="button" id="cancel-btn" class="hidden">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Product section -->
      <div class="products-section">
        <div class="products-header">
          <h2>Products</h2>
          <input type="text" id="search" placeholder="Search...">
        </div>

        <div id="products-list">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>

    <div class="notification" id="notification">
      <p id="notification-message"></p>
    </div>

    <script src="./app.js"></script>
  </div>
</body>
</html>
